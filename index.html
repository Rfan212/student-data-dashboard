<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Data Dashboard</title>

    <!-- Link Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    <!-- Link Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Link Javascript -->
    <script src="script.js" defer></script>
  </head>
  <body class="d-flex flex-column min-vh-100 bg-1">
    <!-- Navbar -->
    <nav class="navbar sm:navbar-expand bg-primary" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand fs-xl fw-bold" href="#home">Student Dashboard</a>
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
          </div>
          <div class="drawer-body">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#home">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#contact">About Us</a>
              </li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>

    <!-- Table -->
    <main class="flex-grow-1">
      <div class="container" id="home">
        <div class="judul-search row bg-body rounded-top g-3">
          <div class="sm:col-6 text-center sm:text-start">
            <h3 class="fw-bold fg-primary">Daftar Nilai Siswa</h3>
          </div>
          <div class="sm:col-6">
            <div class="form-field d-flex justify-content-center">
              <div class="d-flex align-items-center gap-3 p-3 border rounded-3 w-50 sm:ms-auto">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" aria-hidden="true" viewBox="0 0 16 16">
                  <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                </svg>
                <input type="search" class="form-ghost" id="exampleGhostInput" placeholder="Cari nama siswa..." aria-label="Cari nama siswa" />
              </div>
            </div>
          </div>
        </div>
        <table class="table table-striped text-center my-1">
          <thead>
            <tr>
              <th scope="col">No</th>
              <th scope="col" class="text-start">Nama Siswa</th>
              <th scope="col">Kelas</th>
              <th scope="col">Nilai (Score)</th>
            </tr>
          </thead>
          <tbody id="tabelMurid"></tbody>
        </table>
        <div class="wadah-average d-flex justify-content-end align-items-center bg-body rounded-bottom">
          <p class="m-0 fw-bold fg-secondary">Rata-rata Nilai Kelas:<span class="hasilScore" id="avScore"></span></p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-inverse bg-gradient fg-white">
      <div class="container text-center">
        <p class="fw-bold pt-5">Connect with Us</p>
        <div class="d-flex gap-5 justify-content-center mb-4" id="contact">
          <a href="#"><i data-feather="linkedin"></i></a>
          <a href="#"><i data-feather="facebook"></i></a>
          <a href="#"><i data-feather="instagram"></i></a>
          <a href=""><i data-feather="github"></i></a>
        </div>
        <p class="mb-0 pb-2">&copy; Student Dashboard. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
